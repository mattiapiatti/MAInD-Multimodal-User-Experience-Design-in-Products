[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "health-companion-client"
version = "0.2.0"
description = "Hormonal health companion — owns the persona and the learned memory; connects to an external Voice Agent Service for speech, language, and memory compute."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mattia Piatti" }]
keywords = ["health", "companion", "voice", "memory", "offline"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
# Local microphone frontend (host-side; not needed when an external audio device
# such as the Arduino connects directly to the session's voice URL).
frontend = [
    "sounddevice>=0.4",
    "numpy>=1.26",
    "websockets>=13.0",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
companion = "companion_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
