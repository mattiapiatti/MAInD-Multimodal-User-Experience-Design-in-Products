[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voicebot"
version = "0.1.0"
description = "Voice assistant — fully-local, voice-only travel-companion AI (faster-whisper + Ollama + Kokoro)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mattia Piatti" }]
keywords = ["ai", "travel", "voice", "ollama", "whisper", "kokoro", "offline"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "faster-whisper>=1.0",
    "kokoro-onnx>=0.4",
    "websockets>=13.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
voicebot = "voicebot.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voicebot = ["system_prompt.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
