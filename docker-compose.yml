services:
  companion:
    build:
      context: .
    image: health-companion-client:latest
    container_name: companion
    env_file:
      # Holds VA_BASE_URL and the Cloudflare Access service token (VA_CF_ACCESS_*).
      # Copy .env.example to .env and fill in the token; never commit .env.
      # required: false so `docker compose` still works before .env is created.
      - path: .env
        required: false
    environment:
      # v2 default: the deployed Voice Agent Service over HTTPS/WSS behind Cloudflare
      # Access. Override in .env (e.g. http://host.docker.internal:8080 for a local
      # engine — OrbStack maps host.docker.internal to the Mac).
      VA_BASE_URL: "${VA_BASE_URL:-https://voice-agent-service.mattiapiatti.eu}"
      COMPANION_PROFILE_TYPES: "therapy,preference"
    volumes:
      # The learned memory is the source of truth and lives on the host: bind-mount
      # it so what the service learns is written back here and survives restarts.
      - ./memory/vault:/app/memory/vault
      # Reference knowledge (read-only) and the persona (read-only).
      - ./memory/knowledge:/app/memory/knowledge:ro
      - ./persona:/app/persona:ro
    extra_hosts:
      # Fallback for non-OrbStack Docker; OrbStack provides this without it.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped